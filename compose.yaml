services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: global_fund_evolve
      POSTGRES_USER: global_fund_evolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - global_fund_evolve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U global_fund_evolve -d global_fund_evolve"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3102
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3102}
      DATABASE_URL: postgres://global_fund_evolve:${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}@postgres:5432/global_fund_evolve
    ports:
      - "127.0.0.1:3102:3102"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  global_fund_evolve_pgdata:
